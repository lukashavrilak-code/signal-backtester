[project]
name = "signal-backtester"
version = "0.1.0"
description = "Retrospective backtest: would a standard disproportionality method have flagged known drug safety signals before regulators acted?"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.0",
    "pydantic>=2.14.2",
    "pypdf>=7.0.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.scripts]
backtester = "backtester.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backtester"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
