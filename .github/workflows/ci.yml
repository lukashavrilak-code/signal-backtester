# Lint and test on every push and pull request.
# Runs on small fixtures only: no FAERS downloads, no API keys.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to a commit SHA (the tag is in the comment).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install the locked environment
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Validate the study files
        run: uv run backtester validate-config

      - name: Tests
        run: uv run pytest
